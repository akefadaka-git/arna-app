<!doctype html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARNA shared appointment browser verification</title>
</head>
<body>
  <div id="appointment-test-root"></div>
  <script type="module">
    import { createApp } from 'vue';
    import { createPinia } from 'pinia';
    import AppointmentWorkspaceView from '/src/features/appointments/AppointmentWorkspaceView.vue';
    import { appointmentWorkspaceLabels } from '/src/features/appointments/labels.ts';
    import { useAuthStore } from '/src/stores/auth.ts';

    const pinia = createPinia();
    const app = createApp(AppointmentWorkspaceView, { labels: appointmentWorkspaceLabels });
    app.use(pinia);
    const auth = useAuthStore(pinia);
    auth.setUser({
      id: 9001,
      name: 'Appointment Browser QA',
      email: 'appointment-browser-qa@example.invalid',
      locale: 'am',
      default_tenant_id: 9001,
      roles: [],
      permissions: ['calendar.view', 'calendar.create', 'calendar.update'],
      tenants: [],
    });
    app.mount('#appointment-test-root');
    window.__appointmentBrowserHarness = app;
  </script>
</body>
</html>
