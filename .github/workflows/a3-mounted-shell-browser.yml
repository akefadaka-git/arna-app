name: A3 mounted application-shell browser verification

on:
  push:
    branches: ["feat/pr88-mounted-shell-tests-a3"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mounted-shell-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
      - name: Assert exact checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "A3 mounted-shell candidate SHA: ${GITHUB_SHA}"
          echo "Checked-out SHA: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Start workspace Vite server and verify mounted shells
        shell: bash
        run: |
          set -euo pipefail
          npx vite --mode workspace --host 127.0.0.1 --port 4175 --strictPort > "$RUNNER_TEMP/a3-mounted-shell-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4175/tests/fixtures/app-shells.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4175/tests/fixtures/app-shells.html >/dev/null
          APP_SHELLS_URL=http://127.0.0.1:4175/tests/fixtures/app-shells.html npx playwright test tests/app-shells-browser.spec.mjs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arna-a3-mounted-shell-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
