name: Isolated public browser contract integration after card contrast correction

on:
  push:
    branches:
      - audit/arna-repository-consolidation-2026-11-04
    paths:
      - .github/workflows/browser-contract-integration.yml

permissions:
  contents: write

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install browser test dependencies as exact dev dependencies
        run: |
          npm install --save-dev --save-exact @vue/compiler-sfc@3.5.44 @playwright/test@latest @axe-core/playwright@latest
          npm pkg set 'scripts.test:public-browser=playwright test tests/public-browser-contract.spec.mjs'
      - name: Type-check and build all four applications
        run: npm run build
      - name: Block high and critical dependency advisories
        run: npm audit --audit-level=high
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run public browser and accessibility contracts
        shell: bash
        run: |
          npx vite preview --outDir dist-public --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/public-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          PUBLIC_SITE_URL=http://127.0.0.1:4173/ npm run test:public-browser
      - name: Commit verified browser test dependencies and script
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No browser test dependency changes to commit."
          else
            git commit -m "test(public): wire browser and axe accessibility contracts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
