name: Prepare ARNA public website package for Plesk

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Optional exact 40-character main commit SHA to package"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: arna-public-site-package
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Build, verify and package public website for manual Plesk handling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target="${REQUESTED_SHA:-${EVENT_SHA}}"
          [[ "$target" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "A full 40-character SHA is required."; exit 1; }
          echo "sha=${target,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Assert exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build all applications and type-check
        run: npm run build

      - name: Verify static outputs and deployment policy
        run: npm run verify:build

      - name: Smoke-check public build
        run: npm run test:public-build-smoke

      - name: Assert official Maale Arna PNG logo is in the public package
        shell: bash
        run: |
          set -euo pipefail
          test -s public/logo.png
          test -s dist-public/logo.png
          if grep -Eiq 'logo\.(svg|webp)' public-entry/index.html src/layouts/PublicSiteLayout.vue src/public-site/CorporateDynamicHome.vue; then
            echo "Unexpected SVG/WebP logo reference in public site shell."
            exit 1
          fi
          file dist-public/logo.png

      - name: Upload immutable Plesk handoff artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arna-public-site-plesk-${{ steps.source.outputs.sha }}
          path: dist-public/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Record manual Plesk handoff boundary
        run: |
          echo "Package prepared for manual handling through the Plesk server."
          echo "This workflow does not connect to Plesk, upload files, change DNS, or deploy."
          echo "Artifact source SHA: ${{ steps.source.outputs.sha }}"
          echo "Public artifact: dist-public/"
