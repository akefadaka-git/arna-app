name: Public corporate website A4 verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "docs/public-site/**"
      - "public-entry/**"
      - "src/public-site/**"
      - "src/features/public-site/**"
      - "src/router/pages/AdminCorporateSiteRoute.vue"
      - "tests/public-build-smoke.test.mjs"
      - "tests/public-cms-admin-lifecycle.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/public-site-a4.yml"

permissions:
  contents: read

jobs:
  public-site-a4:
    name: Public build, CMS contract and WCAG browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact pull request revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build the public website
        run: npm run build:public
      - name: Verify public build entry and local assets
        run: npm run test:public-build-smoke
      - name: Verify structured bilingual CMS editor and lifecycle controls
        run: npm run test:public-cms-admin-lifecycle
      - name: Install Chromium for public browser checks
        run: npx playwright install --with-deps chromium
      - name: Verify public routes, responsive behavior and WCAG 2.2 accessibility
        shell: bash
        run: |
          npx vite preview --outDir dist-public --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/public-site-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          PUBLIC_SITE_URL=http://127.0.0.1:4173/ npm run test:public-browser
