name: Merged Branch Cleanup (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Direct cleanup to the governed lifecycle
        shell: bash
        run: |
          echo "::notice::Bulk merged-branch deletion is retired."
          echo "::notice::Use owner-governed-branch-lifecycle.yml for one exact PR branch at a time."
          echo "::notice::The lifecycle requires exact head/base SHAs, approved review, passing checks, post-merge exact-SHA tests, and verified ref absence."
