name: Frontend verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "test/**"]

permissions:
  contents: read

jobs:
  type-check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency vulnerability inventory
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            console.log("Vulnerability counts:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const via = (item.via ?? []).map(entry => typeof entry === "string" ? entry : entry.title).join("; ");
              console.log(JSON.stringify({ name, severity: item.severity, isDirect: item.isDirect, range: item.range, via, fixAvailable: item.fixAvailable }));
            }
          '
      - name: Block high and critical dependency advisories
        run: npm audit --audit-level=high
      - name: Type-check and build all applications
        run: npm run build
      - name: Verify root entry points, local assets, and deployment policy
        run: npm run verify:build
      - name: Smoke-check the standalone public build artifacts
        run: npm run test:public-build-smoke
      - name: Verify approved ARNA palette and contrast contract
        run: npm run test:brand-palette-contract
      - name: Verify bilingual themes and shared accessible component contracts
        run: npm run test:design-system-theme-contract
      - name: Verify responsive App Shell layout and accessibility contracts
        run: npm run test:app-shell-responsive-contract
      - name: Verify wallet opening form integration
        run: npm run test:wallet-open-form-contract
      - name: Upload versioned static build outputs
        uses: actions/upload-artifact@v4
        with:
          name: arna-frontend-build-${{ github.sha }}
          path: |
            dist/
            dist-portal/
            dist-admin/
            dist-public/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
