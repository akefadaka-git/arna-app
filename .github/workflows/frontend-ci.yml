name: Frontend verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "test/**"]

permissions:
  contents: read

jobs:
  type-check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency vulnerability inventory
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            console.log("Vulnerability counts:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const via = (item.via ?? []).map(entry => typeof entry === "string" ? entry : entry.title).join("; ");
              console.log(JSON.stringify({ name, severity: item.severity, isDirect: item.isDirect, range: item.range, via, fixAvailable: item.fixAvailable }));
            }
          '
      - name: Block high and critical dependency advisories
        run: npm audit --audit-level=high
      - name: Type-check and build all applications
        run: npm run build
      - name: Verify root entry points, local assets, and deployment policy
        run: npm run verify:build
      - name: Smoke-check the standalone public build artifacts
        run: npm run test:public-build-smoke
      - name: Verify approved ARNA palette and contrast contract
        run: npm run test:brand-palette-contract
      - name: Verify bilingual themes and shared accessible component contracts
        run: npm run test:design-system-theme-contract
      - name: Verify responsive App Shell layout and accessibility contracts
        run: npm run test:app-shell-responsive-contract
      - name: Verify wallet opening form integration
        run: npm run test:wallet-open-form-contract
      - name: Verify workspace dashboard route integration
        run: npm run test:workspace-dashboard-route-contract
      - name: Install Chromium for public browser contracts
        run: npx playwright install --with-deps chromium
      - name: Verify public browser and WCAG 2.2 accessibility contracts
        shell: bash
        run: |
          npx vite preview --outDir dist-public --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/public-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          PUBLIC_SITE_URL=http://127.0.0.1:4173/ npm run test:public-browser
      - name: Upload versioned static build outputs
        uses: actions/upload-artifact@v4
        with:
          name: arna-frontend-build-${{ github.sha }}
          path: |
            dist/
            dist-portal/
            dist-admin/
            dist-public/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
