name: Frontend verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "fix/**", "test/**"]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact merge SHA to verify after merge"
        required: true
        type: string

permissions:
  contents: read

jobs:
  type-check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency vulnerability inventory
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            console.log("Vulnerability counts:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const via = (item.via ?? []).map(entry => typeof entry === "string" ? entry : entry.title).join("; ");
              console.log(JSON.stringify({ name, severity: item.severity, isDirect: item.isDirect, range: item.range, via, fixAvailable: item.fixAvailable }));
            }
          '
      - name: Block high and critical dependency advisories
        run: npm audit --audit-level=high
      - name: Verify notification route, tenant and locale security contracts
        run: npm run test:notifications-locale-contract
      - name: Verify Owner-governed branch lifecycle workflow contract
        run: npm run test:owner-governed-lifecycle-workflow-contract
      - name: Verify Admin Domain Management route and registry safety contracts
        run: npm run test:admin-domain-registry-contract
      - name: Verify Admin settings, integrations and operations contracts
        run: node --test tests/admin-settings-contract.test.mjs tests/admin-operations-contract.test.mjs
      - name: Verify Admin tenant membership and Owner-approved RBAC lifecycle contracts
        run: node --test tests/admin-tenant-lifecycle-contract.test.mjs
      - name: Verify platform Audit and Security read-only isolation contract
        run: node --test tests/admin-platform-audit-security-contract.test.mjs
      - name: Type-check and build all applications
        run: npm run build
      - name: Verify root entry points, local assets, and deployment policy
        run: npm run verify:build
      - name: Smoke-check the standalone public build artifacts
        run: npm run test:public-build-smoke
      - name: Verify structured bilingual corporate CMS and lifecycle controls
        run: npm run test:public-cms-admin-lifecycle
      - name: Verify approved ARNA palette and contrast contract
        run: npm run test:brand-palette-contract
      - name: Verify bilingual themes and shared accessible component contracts
        run: npm run test:design-system-theme-contract
      - name: Verify visual, media and motion library contracts
        run: npm run test:visual-library-contract
      - name: Verify 2D/3D visual panels and workspace integration
        run: npm run test:visual-panel-integration-contract
      - name: Verify A4 high-risk component API and lifecycle contracts
        run: npm run test:a4-component-risk-contract
      - name: Verify responsive App Shell layout and accessibility contracts
        run: npm run test:app-shell-responsive-contract
      - name: Verify wallet opening form integration
        run: npm run test:wallet-open-form-contract
      - name: Verify workspace dashboard route integration
        run: npm run test:workspace-dashboard-route-contract
      - name: Verify Calendar workspace route and E.C. API contracts
        run: npm run test:calendar-workspace-contract
      - name: Verify Executive Overview route and audience contract
        run: npm run test:executive-overview-route-contract
      - name: Install Chromium for public browser contracts
        run: npx playwright install --with-deps chromium
      - name: Verify returning-user OTP login and browser SSO cookie lifecycle
        shell: bash
        run: |
          VITE_API_BASE_URL=http://localhost:4178 npx vite --mode workspace --host localhost --port 4178 --strictPort > "$RUNNER_TEMP/auth-login-preview.log" 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:4178/tests/fixtures/auth-login.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:4178/tests/fixtures/auth-login.html >/dev/null
          AUTH_LOGIN_APP_URL=http://localhost:4178/tests/fixtures/auth-login.html npm run test:auth-login-browser
      - name: Verify Calendar workspace E.C. behavior in Chromium
        shell: bash
        run: |
          VITE_API_BASE_URL=http://127.0.0.1:4174 npx vite --mode workspace --host 127.0.0.1 --port 4174 --strictPort > "$RUNNER_TEMP/calendar-workspace-vite.log" 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/tests/fixtures/calendar-workspace-browser.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/tests/fixtures/calendar-workspace-browser.html >/dev/null
          CALENDAR_APP_URL=http://127.0.0.1:4174/ npm run test:calendar-browser
      - name: Verify public browser and WCAG 2.2 accessibility contracts
        shell: bash
        run: |
          npx vite preview --outDir dist-public --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/public-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          PUBLIC_SITE_URL=http://127.0.0.1:4173/ npm run test:public-browser
      - name: Render visual library across mobile, tablet, desktop, locales and themes
        shell: bash
        run: |
          npx vite --mode workspace --host 127.0.0.1 --port 4175 --strictPort > "$RUNNER_TEMP/visual-review-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4175/tests/fixtures/visual-library.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4175/tests/fixtures/visual-library.html >/dev/null
          VISUAL_LIBRARY_URL=http://127.0.0.1:4175/tests/fixtures/visual-library.html npx playwright test tests/visual-library-rendered.spec.mjs
      - name: Upload rendered visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arna-visual-review-${{ github.sha }}
          path: artifacts/visual-review/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify mounted Combobox, Modal and Drawer browser interactions
        shell: bash
        run: |
          npx vite --mode workspace --host 127.0.0.1 --port 4176 --strictPort > "$RUNNER_TEMP/a4-components-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4176/tests/fixtures/a4-components.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4176/tests/fixtures/a4-components.html >/dev/null
          A4_COMPONENTS_URL=http://127.0.0.1:4176/tests/fixtures/a4-components.html npm run test:a4-components-browser
      - name: Verify mounted FileUploader lifecycle and accessibility
        shell: bash
        run: |
          npx vite --mode workspace --host 127.0.0.1 --port 4177 --strictPort > "$RUNNER_TEMP/a4-file-uploader-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4177/tests/fixtures/a4-file-uploader.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4177/tests/fixtures/a4-file-uploader.html >/dev/null
          A4_FILE_UPLOADER_URL=http://127.0.0.1:4177/tests/fixtures/a4-file-uploader.html npm run test:a4-file-uploader-browser
      - name: Upload versioned static build outputs
        uses: actions/upload-artifact@v4
        with:
          name: arna-frontend-build-${{ github.sha }}
          path: |
            dist/
            dist-portal/
            dist-admin/
            dist-public/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
