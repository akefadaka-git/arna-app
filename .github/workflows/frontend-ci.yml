name: Frontend verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "test/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  type-check-and-build:
    # Pin the current LTS runner image instead of the moving ubuntu-latest alias.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build all applications
        run: npm run build
      - name: Verify root entry points, local assets, and deployment policy
        run: npm run verify:build
      - name: Smoke-check the standalone public build artifacts
        run: npm run test:public-build-smoke
      - name: Verify approved ARNA palette and contrast contract
        run: npm run test:brand-palette-contract
      - name: Upload versioned static build outputs
        uses: actions/upload-artifact@v4
        with:
          name: arna-frontend-build-${{ github.sha }}
          path: |
            dist/
            dist-portal/
            dist-admin/
            dist-public/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
