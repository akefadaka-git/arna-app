name: A5 static production artifact verification

on:
  pull_request:
    branches: [ "feat/executive-overview-a3" ]
    paths:
      - "docs/operations/A5-STATIC-PRODUCTION-HOSTING-BASELINE.md"
      - ".github/workflows/a5-static-production-verification.yml"
      - "scripts/verify-static-build.mjs"
      - "vite.config.ts"
      - ".env.workspace"
      - ".env.portal"
      - ".env.admin"
      - ".env.public"
  push:
    branches: [ "hardening/**" ]
    paths:
      - "docs/operations/A5-STATIC-PRODUCTION-HOSTING-BASELINE.md"
      - ".github/workflows/a5-static-production-verification.yml"
      - "scripts/verify-static-build.mjs"
      - "vite.config.ts"
      - ".env.workspace"
      - ".env.portal"
      - ".env.admin"
      - ".env.public"

permissions:
  contents: read

concurrency:
  group: a5-app-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build all four applications
        run: npm run build
      - name: Verify production static artifacts and host policy
        run: npm run verify:build
      - name: Run static artifact smoke and security contracts
        run: |
          npm run test:public-build-smoke
          npm run test:brand-palette-contract
          npm run test:design-system-theme-contract
          npm run test:app-shell-responsive-contract
          npm run test:wallet-open-form-contract
          npm run test:workspace-dashboard-route-contract
          npm run test:error-handling-contract

      # Short-lived CI handoff packages for the four independently hosted sites.
      # Hidden files are included because each verified output contains its required .htaccess.
      - name: Package Workspace static site
        uses: actions/upload-artifact@v4
        with:
          name: arna-workspace-static
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Package Shareholder Portal static site
        uses: actions/upload-artifact@v4
        with:
          name: arna-shareholder-portal-static
          path: dist-portal/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Package Administration static site
        uses: actions/upload-artifact@v4
        with:
          name: arna-administration-static
          path: dist-admin/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Package Public Website static site
        uses: actions/upload-artifact@v4
        with:
          name: arna-public-website-static
          path: dist-public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
