name: Retire owner-authorized duplicate calendar branch reference

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-calendar-current-main-reconciled.yml

permissions:
  contents: write

concurrency:
  group: retire-calendar-current-main-reconciled
  cancel-in-progress: false

jobs:
  retire:
    if: github.event.head_commit.message == 'Install owner-authorized duplicate calendar branch retirement workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact head, delete only authorized ref, and confirm absence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          branch="feat/arna-calendar-current-main-reconciled"
          expected="3d13e326625436f3e1656e2c9769c86c27994c42"
          api="https://api.github.com/repos/${repo}/git/ref/heads/${branch}"
          delete_api="https://api.github.com/repos/${repo}/git/refs/heads/${branch}"

          actual="$(curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}" | jq -r '.object.sha')"
          test "${actual}" = "${expected}" || { echo "FAIL: exact-head mismatch; expected ${expected}, got ${actual}"; exit 1; }
          echo "PASS: exact head verified: ${branch} @ ${actual}"

          code="$(curl --silent --show-error -o /tmp/delete-response.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${delete_api}")"
          test "${code}" = "204" || { cat /tmp/delete-response.json; echo "FAIL: deletion returned HTTP ${code}"; exit 1; }
          echo "PASS: deletion accepted for the single authorized branch"

          verify_code="$(curl --silent --show-error -o /tmp/verify-response.json -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}")"
          test "${verify_code}" = "404" || { cat /tmp/verify-response.json; echo "FAIL: branch still exists or verification failed (HTTP ${verify_code})"; exit 1; }
          echo "PASS: branch absence verified (HTTP 404)"
