name: A4 exact-SHA namespace verification

on:
  push:
    branches:
      - verify/a4-namespace-migration

permissions:
  contents: read

concurrency:
  group: a4-namespace-verification-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-sha-browser-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: 14d73968927c2a2c97b2f725c58be986322bc694
    steps:
      - name: Checkout exact A3.1 candidate SHA
        uses: actions/checkout@v4
        with:
          ref: 14d73968927c2a2c97b2f725c58be986322bc694
          fetch-depth: 1
      - name: Assert exact tested source SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "A4 target SHA: $TARGET_SHA"
          echo "A4 checked-out SHA: $ACTUAL"
          test "$ACTUAL" = "$TARGET_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify ARNA identity and storage compatibility
        run: npm run test:brand-identity-contract
      - name: Verify design tokens, themes, shells and component contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:brand-palette-contract
          npm run test:design-system-theme-contract
          npm run test:app-shell-responsive-contract
          npm run test:error-handling-contract
          npm run test:a4-component-risk-contract
          npm run test:visual-library-contract
          npm run test:visual-panel-integration-contract
          npm run test:wallet-open-form-contract
          npm run test:workspace-dashboard-route-contract
      - name: Type-check and build all four applications
        run: npm run build:all
      - name: Verify static deployment outputs
        run: npm run verify:build
      - name: Smoke-test standalone public build
        run: npm run test:public-build-smoke
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify public browser routes, responsive behavior, keyboard navigation and WCAG 2.2 AA
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --outDir dist-public --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/a4-public-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          PUBLIC_SITE_URL=http://127.0.0.1:4173/ npm run test:public-browser
      - name: Verify visual library across viewport, locale and theme matrix with axe
        shell: bash
        run: |
          set -euo pipefail
          npx vite --mode workspace --host 127.0.0.1 --port 4175 --strictPort > "$RUNNER_TEMP/a4-visual-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4175/tests/fixtures/visual-library.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4175/tests/fixtures/visual-library.html >/dev/null
          VISUAL_LIBRARY_URL=http://127.0.0.1:4175/tests/fixtures/visual-library.html npx playwright test tests/visual-library-rendered.spec.mjs
      - name: Verify mounted ARNA components, keyboard interaction, focus restoration and axe accessibility
        shell: bash
        run: |
          set -euo pipefail
          npx vite --mode workspace --host 127.0.0.1 --port 4176 --strictPort > "$RUNNER_TEMP/a4-components-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4176/tests/fixtures/a4-components.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4176/tests/fixtures/a4-components.html >/dev/null
          A4_COMPONENTS_URL=http://127.0.0.1:4176/tests/fixtures/a4-components.html npm run test:a4-components-browser
      - name: Verify FileUploader keyboard, lifecycle and axe accessibility
        shell: bash
        run: |
          set -euo pipefail
          npx vite --mode workspace --host 127.0.0.1 --port 4177 --strictPort > "$RUNNER_TEMP/a4-file-uploader-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4177/tests/fixtures/a4-file-uploader.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4177/tests/fixtures/a4-file-uploader.html >/dev/null
          A4_FILE_UPLOADER_URL=http://127.0.0.1:4177/tests/fixtures/a4-file-uploader.html npm run test:a4-file-uploader-browser
      - name: Upload exact-SHA visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arna-a4-visual-review-\${{ env.TARGET_SHA }}
          path: artifacts/visual-review/
          if-no-files-found: warn
          retention-days: 14
