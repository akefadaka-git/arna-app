name: Delete owner-authorized ARNA App branches

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-authorized-legacy-branches.yml

permissions:
  contents: write

concurrency:
  group: owner-authorized-arna-app-branch-retirement
  cancel-in-progress: false

jobs:
  delete-authorized-branches:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Install owner-authorized ARNA branch retirement workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Verify all four exact branch heads before any deletion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          verify_branch() {
            local branch="$1"
            local expected="$2"
            local actual
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::STOP: $branch expected $expected but found $actual"
              exit 1
            fi
            echo "PASS exact head: $branch @ $actual"
          }

          verify_branch "integration/pr69-on-main-2026-11-17" "f251f62446d443b2366fb33c9e92105509ba46d9"
          verify_branch "fix/arna-public-emblem" "e7047770e8f0a35d659ccfa258acbb4806d91f30"
          verify_branch "feat/p1-4-people-domain-ui" "ee82cf6c4b6e8ebbeb6543ce044d9241a83f3101"
          verify_branch "feat/people-lifecycle-display-a3" "e231fc299eb24a7c73ce55d17ae8e5f4f4fcfaf7"

      - name: Delete only the four exact authorized refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          delete_if_exact() {
            local branch="$1"
            local expected="$2"
            local actual
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::STOP before deleting $branch: expected $expected but found $actual"
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "DELETE accepted for exact authorized ref: $branch @ $expected"
          }

          delete_if_exact "integration/pr69-on-main-2026-11-17" "f251f62446d443b2366fb33c9e92105509ba46d9"
          delete_if_exact "fix/arna-public-emblem" "e7047770e8f0a35d659ccfa258acbb4806d91f30"
          delete_if_exact "feat/p1-4-people-domain-ui" "ee82cf6c4b6e8ebbeb6543ce044d9241a83f3101"
          delete_if_exact "feat/people-lifecycle-display-a3" "e231fc299eb24a7c73ce55d17ae8e5f4f4fcfaf7"

      - name: Verify only the four authorized refs are absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          verify_absent() {
            local branch="$1"
            local response
            local status
            response="$(gh api --include "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" 2>&1 || true)"
            status="$(printf '%s\n' "$response" | awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }')"
            if [[ "$status" != "404" ]]; then
              echo "::error::Expected HTTP 404 for deleted ref $branch; got status ${status:-unknown}"
              printf '%s\n' "$response"
              exit 1
            fi
            echo "PASS verified absent: $branch"
          }

          verify_absent "integration/pr69-on-main-2026-11-17"
          verify_absent "fix/arna-public-emblem"
          verify_absent "feat/p1-4-people-domain-ui"
          verify_absent "feat/people-lifecycle-display-a3"
