name: Isolated frontend dependency refresh audit

on:
  push:
    branches:
      - audit/arna-repository-consolidation-2026-11-04
    paths:
      - .github/workflows/dependency-refresh-audit.yml

permissions:
  contents: read

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install current locked dependencies
        run: npm ci
      - name: Apply non-major security updates
        run: |
          npm install --save-exact axios@1.21.0 vue@3.5.44 vite@6.4.5
          npm audit fix || true
      - name: Type-check and build all four applications
        run: npm run build
      - name: Verify static build outputs and public smoke
        run: |
          npm run verify:build
          npm run test:public-build-smoke
          npm run test:brand-palette-contract
          npm run test:design-system-theme-contract
          npm run test:app-shell-responsive-contract
      - name: Record remaining dependency advisories
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-after.json" || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit-after.json", "utf8"));
            console.log("Post-refresh vulnerability counts:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const via = (item.via ?? []).map(entry => typeof entry === "string" ? entry : entry.title).join("; ");
              console.log(JSON.stringify({ name, severity: item.severity, isDirect: item.isDirect, range: item.range, via, fixAvailable: item.fixAvailable }));
            }
          '
      - name: Upload candidate dependency manifests and audit report
        uses: actions/upload-artifact@v4
        with:
          name: arna-app-dependency-refresh-candidate
          path: |
            package.json
            package-lock.json
            ${{ runner.temp }}/npm-audit-after.json
          if-no-files-found: error
