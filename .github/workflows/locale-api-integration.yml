name: ARNA frontend/API locale integration

on:
  pull_request:
    paths:
      - ".github/workflows/locale-api-integration.yml"
      - "vite.config.ts"
      - "src/core/api/client.ts"
      - "src/features/locale/**"
      - "src/layouts/AppShell/LanguageSelector/**"
      - "src/layouts/AppShell/AppShell.vue"
      - "tests/locale-api-integration.spec.mjs"
      - "tests/fixtures/locale-api-integration.*"
  workflow_dispatch:
    inputs:
      api_sha:
        description: "Exact ARNA API commit to integrate against"
        required: true
        default: "60d08e2f1f224b48d1086b8a2bde0b50b2296487"
        type: string

permissions:
  contents: read

jobs:
  locale-api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arna_locale_integration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: arna_locale_integration
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout frontend at the PR head
        uses: actions/checkout@v4

      - name: Checkout the exact API implementation under test
        uses: actions/checkout@v4
        with:
          repository: akefadaka-git/arna-api
          ref: ${{ inputs.api_sha || '60d08e2f1f224b48d1086b8a2bde0b50b2296487' }}
          path: arna-api
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, curl, dom, fileinfo, mbstring, mysqli, pdo_mysql, session, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install API dependencies
        working-directory: arna-api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Migrate the disposable MySQL database
        working-directory: arna-api
        run: |
          touch .env
          php artisan migrate --force

      - name: Provision an isolated API integration user
        id: integration-user
        working-directory: arna-api
        shell: bash
        run: |
          set -euo pipefail
          token="$(php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); $user = MaaleArna\MASES\Core\Auth\Models\User::factory()->create(["locale" => "am"]); echo $user->createToken("locale-integration")->plainTextToken;')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "LOCALE_INTEGRATION_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Start the real Laravel API
        working-directory: arna-api
        shell: bash
        run: |
          set -euo pipefail
          php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/arna-api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/arna-api.log"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend adapter against the real API
        shell: bash
        env:
          VITE_API_BASE_URL: http://127.0.0.1:4175
          ARNA_LOCALE_INTEGRATION_API_TARGET: http://127.0.0.1:8000
          LOCALE_API_INTEGRATION_URL: http://127.0.0.1:4175/tests/fixtures/locale-api-integration.html
        run: |
          set -euo pipefail
          npx vite --mode workspace --host 127.0.0.1 --port 4175 --strictPort > "$RUNNER_TEMP/arna-locale-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent "$LOCALE_API_INTEGRATION_URL" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "$LOCALE_API_INTEGRATION_URL" >/dev/null
          npx playwright test tests/locale-api-integration.spec.mjs
