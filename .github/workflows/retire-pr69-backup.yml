name: Retire owner-authorized PR69 backup branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-pr69-backup.yml

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact branch head, delete, and confirm absence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="akefadaka-git/arna-app"
          branch="backup/pr69-legacy-head-2026-11-17"
          expected="d06ec9205c8fd19dd1781178d12a0084efb789b2"
          api="https://api.github.com/repos/${repo}/git/ref/heads/${branch}"
          actual="$(curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}" | jq -r '.object.sha')"
          test "${actual}" = "${expected}" || { echo "FAIL: exact-head mismatch; expected ${expected}, got ${actual}"; exit 1; }
          echo "PASS: exact head verified: ${branch} @ ${actual}"
          code="$(curl --silent --show-error -o /tmp/delete-response.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}")"
          test "${code}" = "204" || { cat /tmp/delete-response.json; echo "FAIL: deletion returned HTTP ${code}"; exit 1; }
          echo "PASS: deletion accepted for the single authorized branch"
          verify_code="$(curl --silent --show-error -o /tmp/verify-response.json -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}")"
          test "${verify_code}" = "404" || { cat /tmp/verify-response.json; echo "FAIL: branch still exists or verification failed (HTTP ${verify_code})"; exit 1; }
          echo "PASS: branch absence verified (HTTP 404)"

# Exact-head retirement workflow; no other refs are in scope.
