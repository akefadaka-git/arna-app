name: Native Android verification

on:
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK and run unit tests
        run: gradle --no-daemon -p native-android assembleDebug testDebugUnitTest

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-build-reports
          path: native-android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
