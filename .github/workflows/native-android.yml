name: Native Android verification
# Uses the AOSP API 34 image: Google Play services are not required by this app.
# TCG fallback is enabled for hosted runners without usable KVM acceleration.

on:
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator

      - name: Install Android SDK 35 and API 34 AOSP emulator
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-34;default;x86_64"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK and run unit tests
        run: gradle --no-daemon -p native-android assembleDebug testDebugUnitTest

      - name: Run Android Keystore and device identity instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          script: |
            set -euo pipefail
            ready=0
            for attempt in $(seq 1 180); do
              booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)"
              package_service="$(adb shell service check package 2>/dev/null || true)"
              activity_service="$(adb shell service check activity 2>/dev/null || true)"
              if [ "$booted" = "1" ] && echo "$package_service" | grep -q "found" && echo "$activity_service" | grep -q "found"; then
                if adb shell cmd package list packages >/dev/null 2>&1 && adb shell cmd activity get-config >/dev/null 2>&1; then
                  ready=1
                  break
                fi
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::Android package/activity services did not become stable within 360 seconds."
              adb shell service list | grep -E "package|activity" || true
              adb logcat -d -t 1000 || true
              exit 1
            fi
            sleep 10
            adb shell cmd package list packages >/dev/null
            adb shell cmd activity get-config >/dev/null
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            gradle --no-daemon -p native-android connectedDebugAndroidTest

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-build-reports
          path: native-android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
