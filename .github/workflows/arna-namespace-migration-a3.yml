name: ARNA active namespace migration A3.1

on:
  push:
    branches:
      - feat/arna-active-namespace-migration-a3
    paths:
      - .github/workflows/arna-namespace-migration-a3.yml
      - scripts/migrate-arna-active-namespaces.mjs
      - src/**
      - tests/**
      - workspace-entry/**
      - portal-entry/**
      - admin-entry/**
      - public-entry/**
      - .env.*
      - package.json
      - package-lock.json
      - README.md
      - vite.config.ts

permissions:
  contents: write

concurrency:
  group: arna-active-namespace-migration-a3
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/arna-active-namespace-migration-a3
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply deterministic namespace migration
        run: node scripts/migrate-arna-active-namespaces.mjs

      - name: Commit migration changes to the dedicated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "A3.1 migrate active UI namespaces to ARNA"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No migration changes required."
          fi

      - name: Record exact tested commit
        id: tested
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git status --short
          git rev-parse HEAD

      - name: Verify approved brand identity contract
        run: npm run test:brand-identity-contract

      - name: Verify design-token and theme contracts
        run: |
          npm run test:brand-palette-contract
          npm run test:design-system-theme-contract
          npm run test:app-shell-responsive-contract

      - name: Verify affected component contracts
        run: |
          npm run test:error-handling-contract
          npm run test:a4-component-risk-contract
          npm run test:visual-library-contract
          npm run test:visual-panel-integration-contract

      - name: Type-check all applications
        run: npm run type-check

      - name: Build all four applications
        run: npm run build:all
